function fmtDate(d){
  const dt = new Date(d);
  const ko = dt.toLocaleString('ko-KR', { timeZone:'Asia/Seoul', month:'long', day:'numeric', weekday:'short', hour:'2-digit', minute:'2-digit', hour12:false });
  return ko;
}
function fmtShort(d){
  const dt = new Date(d);
  const m = dt.toLocaleString('ko-KR',{timeZone:'Asia/Seoul', month:'short'});
  const day = dt.toLocaleString('ko-KR',{timeZone:'Asia/Seoul', day:'numeric'});
  const w = dt.toLocaleString('ko-KR',{timeZone:'Asia/Seoul', weekday:'short'});
  return {m, day, w};
}
function getFighter(id){ return FIGHTERS[id] || {name:'TBA', record:'-', rank:'-', recent:[], style:'정보 미공개'} }
function getEvent(id){ return EVENTS.find(e=>e.id===id) }
function nextEvent(){
  const now = new Date('2026-05-08T00:00:00+09:00');
  return EVENTS.filter(e=>new Date(e.dateUtc) > now).sort((a,b)=>new Date(a.dateUtc)-new Date(b.dateUtc))[0];
}
function pastEvents(){
  const now = new Date('2026-05-08T00:00:00+09:00');
  return EVENTS.filter(e=>new Date(e.dateUtc) <= now).sort((a,b)=>new Date(b.dateUtc)-new Date(a.dateUtc));
}
function upcomingEvents(){
  const now = new Date('2026-05-08T00:00:00+09:00');
  return EVENTS.filter(e=>new Date(e.dateUtc) > now).sort((a,b)=>new Date(a.dateUtc)-new Date(b.dateUtc));
}
function countdownParts(targetIso){
  const now = new Date();
  const t = new Date(targetIso) - now;
  const sec = Math.max(0, Math.floor(t/1000));
  const d = Math.floor(sec/86400);
  const h = Math.floor((sec%86400)/3600);
  const m = Math.floor((sec%3600)/60);
  const s = sec%60;
  return {d,h,m,s};
}

        <div class="pct">${e.prediction.aPct}%</div>
      </div>
      <div class="pred-side" style="text-align:right">
        <div class="nm">${getFighter(e.prediction.bId).name}</div>
        <div class="pct">${e.prediction.bPct}%</div>
      </div>

    <div class="pred-bar">
      <div class="a" style="width:${e.prediction.aPct}%"></div>

    </div>
  </div>`:''}

  ${e.mainCard.length?`
  <div class="section-title"><span class="bar"></span>메인 카드</div>
  ${e.mainCard.map(f=>fightRow(f)).join('')}
  `:''}

  ${e.prelims.length?`
  <div class="section-title"><span class="bar"></span>언더 카드 / 프릴림</div>
  ${e.prelims.map(f=>fightRow(f)).join('')}
  `:''}

  ${(!e.mainCard.length && !e.prelims.length)?`
  <div class="box" style="text-align:center;color:var(--muted)">매치업이 아직 발표되지 않았습니다.</div>`:''}
  `;
}
