{"@context":"https://schema.org","@type":"WebSite","name":"FightOclock","url":"https://fightoclock.kr/","inLanguage":"ko-KR","description":"UFC 일정과 결과, 랭킹을 한국어로 정리한 가이드"}
</script>
<style>
  /* ---------- 기본 (시안 D · 에디토리얼 디자인 시스템) ---------- */
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#0B0B0C;
    --bg-1:#0F0F11;
    --bg-2:#141416;
    --card:#111113;
    --card-2:#16161A;
    --line:rgba(255,255,255,.07);
    --line-2:rgba(255,255,255,.13);
    --text:#F2F1EE;
    --muted:rgba(242,241,238,.56);
    --dim:rgba(242,241,238,.52);
    --red:#E5484D;
    --red-2:#E5484D;
    --gold:#C9A24B;
    --gold-2:#D9B461;
    --green:#37C871;
    --blue:#5B86E5;
    --radius:14px;
    --tap:44px;
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    letter-spacing:-.011em;
    overscroll-behavior-y:none;
  }
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom));min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  img{max-width:100%;display:block}
  :focus-visible{outline:2px solid #ff7b80;outline-offset:3px}
  .skip-link{position:fixed;left:12px;top:8px;z-index:1000;padding:10px 14px;border-radius:8px;background:#fff;color:#111;transform:translateY(-150%)}
  .skip-link:focus{transform:none}
  .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

  /* ---------- 헤더 ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;background:rgba(10,10,10,.85);
    backdrop-filter:saturate(140%) blur(10px);
    border-bottom:1px solid var(--line);
    padding:14px 16px calc(14px) 16px;
    padding-top:calc(14px + env(safe-area-inset-top));
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
  .brand .mark{
    width:30px;height:30px;border-radius:8px;
    background:linear-gradient(135deg,var(--red) 0%,#7a0606 100%);
    display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;
    box-shadow:0 6px 16px rgba(210,10,10,.35);
  }
  .brand .name{font-size:16px}
  .brand .name small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.04em}
  .topbar .actions{display:flex;gap:6px}
  .iconbtn{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:18px}
  .iconbtn:hover{background:var(--bg-2);color:var(--text)}

  /* ---------- 메인 ---------- */
  main{max-width:720px;margin:0 auto;padding:14px 16px 24px}
  .view{display:none}
  .view.active{display:block;animation:fade .25s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ---------- 카드 공통 ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:22px 6px 10px;display:flex;align-items:center;gap:8px}
  .section-title .bar{width:3px;height:14px;background:var(--red);border-radius:2px}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;background:#222;color:#ddd}
  .pill.red{background:rgba(210,10,10,.15);color:#ff7676;border:1px solid rgba(210,10,10,.35)}
  .pill.gold{background:rgba(212,160,23,.15);color:var(--gold-2);border:1px solid rgba(212,160,23,.35)}
  .pill.green{background:rgba(34,197,94,.15);color:#7ee2a4;border:1px solid rgba(34,197,94,.35)}
  .pill.blue{background:rgba(59,130,246,.15);color:#9ec3ff;border:1px solid rgba(59,130,246,.35)}
  .pill.ghost{background:transparent;border:1px solid var(--line-2);color:var(--muted)}

  /* ---------- HERO: 다음 경기 ---------- */
  .hero{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);
        background:
          radial-gradient(120% 80% at 80% -10%, rgba(210,10,10,.45) 0%, rgba(210,10,10,0) 60%),
          radial-gradient(80% 60% at 0% 100%, rgba(212,160,23,.18) 0%, rgba(0,0,0,0) 60%),
          linear-gradient(180deg,#1c0808 0%, #0d0d0d 100%);
        padding:18px 16px 16px;
  }
  .hero .label{display:flex;align-items:center;gap:8px;font-size:12px;color:#ffb4b4;font-weight:700;letter-spacing:.08em}
  .hero .label .dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(210,10,10,.3);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(210,10,10,.5)}50%{box-shadow:0 0 0 8px rgba(210,10,10,0)}}
  .hero h1{margin:8px 0 4px;font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1.2}
  .hero .sub{color:#d6d6d6;font-size:13px}
  .hero .matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:18px 0 8px}
  .fighter-tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
  .avatar{width:64px;height:64px;border-radius:50%;background:#2a2a2a;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;border:2px solid var(--line-2);overflow:hidden}
  .avatar.red{border-color:rgba(210,10,10,.6);background:linear-gradient(135deg,#3a0a0a,#1a0606)}
  .avatar.blue{border-color:rgba(59,130,246,.55);background:linear-gradient(135deg,#0a1f3a,#06101a)}
  .fighter-tile .nm{font-weight:800;font-size:13px;line-height:1.2;max-width:9em}
  .fighter-tile .rec{color:var(--muted);font-size:11px}
  .vs{font-weight:900;color:var(--gold);font-size:14px;letter-spacing:.05em}
  .hero .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .meta-cell{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .meta-cell .k{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .meta-cell .v{font-size:13px;font-weight:700;margin-top:2px}
  .countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .cd-cell{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
  .cd-cell .num{font-size:20px;font-weight:900;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
  .cd-cell .lbl{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.06em}

  .hero .cta{margin-top:14px;display:flex;gap:8px}
  .btn{flex:1;height:46px;border-radius:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;letter-spacing:.01em}
  .btn.primary{background:var(--red);color:#fff;box-shadow:0 8px 18px -8px rgba(210,10,10,.7)}
  .btn.primary:hover{background:var(--red-2)}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-2)}
  .btn.ghost:hover{background:#1f1f1f}

  /* ---------- 가로 스크롤 칩 ---------- */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;-ms-overflow-style:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--bg-2);color:var(--muted);font-size:13px;font-weight:600;border:1px solid var(--line)}
  .chip.active{background:var(--red);color:#fff;border-color:var(--red)}
  button.chip{min-height:40px}

  /* ---------- 일정 리스트 ---------- */
  .event-list{display:flex;flex-direction:column;gap:10px}
  .event-item{display:grid;grid-template-columns:60px 1fr auto;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);align-items:center}
  .event-item:active{transform:scale(.99)}
  .date-block{text-align:center;background:#0e0e0e;border:1px solid var(--line);border-radius:10px;padding:6px 0}
  .date-block .m{font-size:10px;color:var(--red-2);font-weight:800;letter-spacing:.08em}
  .date-block .d{font-size:18px;font-weight:900;line-height:1}
  .date-block .w{font-size:10px;color:var(--muted);margin-top:2px}
  .event-item .title{font-weight:800;font-size:14px;letter-spacing:-.01em;line-height:1.25}
  .event-item .meta{color:var(--muted);font-size:12px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
  .event-item .meta b{color:#ddd;font-weight:600}
  .chev{color:var(--dim);font-size:18px}

  /* ---------- 이벤트 상세 ---------- */
  .ev-banner{background:linear-gradient(180deg,#1a0808,#0c0c0c);border:1px solid var(--line);border-radius:18px;padding:16px}
  .ev-banner .badge{display:inline-block;background:var(--red);color:#fff;padding:4px 10px;border-radius:999px;font-weight:800;font-size:11px;letter-spacing:.06em}
  .ev-banner h1,.ev-banner h2{margin:8px 0 4px;font-size:22px;font-weight:900;letter-spacing:-.02em}
  .ev-banner .when{color:#ddd;font-size:13px}
  .ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}

  .fight-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px}
  .fight-card .head{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
  .fight-card .head b{color:var(--gold-2);font-weight:700}
  .fight-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
  .f-side{display:flex;align-items:center;gap:10px;min-width:0}
  .f-side.right{flex-direction:row-reverse;text-align:right}
  .f-side .av{flex:0 0 auto}
  .f-side .nm-wrap{min-width:0}
  .f-side .nm{font-weight:800;font-size:13.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .f-side .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .f-side .rank{font-size:10px;color:var(--gold-2);font-weight:700;letter-spacing:.04em}
  .vs-tiny{font-size:11px;color:var(--dim);font-weight:800}
  .result-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:#ddd}
  .result-row.win{color:#7ee2a4}
  .winbadge{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--green);color:#04210e;margin-right:6px}
  .losebadge{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:#3a3a3a;color:#aaa;margin-right:6px}

  /* ---------- 섹션 박스 ---------- */
  .box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .box h3{margin:0 0 8px;font-size:14px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  .box h3 .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:rgba(210,10,10,.15);color:#ff7676;font-size:12px}
  .box p{margin:0;color:#d8d8d8;font-size:13.5px;line-height:1.6}
  .box ul{margin:8px 0 0;padding-left:18px;color:#d8d8d8;font-size:13.5px;line-height:1.7}
  .box ul li::marker{color:var(--red-2)}
  .box.gold h3 .ic{background:rgba(212,160,23,.18);color:var(--gold-2)}
  .box.blue h3 .ic{background:rgba(59,130,246,.18);color:#9ec3ff}

  .source-line{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--dim);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}

  /* 분석 - 신뢰도 막대 */
  .pred{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .pred-side{background:#0e0e0e;border:1px solid var(--line);border-radius:10px;padding:10px}
  .pred-side .nm{font-size:12px;color:var(--muted)}
  .pred-side .pct{font-size:24px;font-weight:900;letter-spacing:-.02em}
  .pred-bar{height:8px;background:#262626;border-radius:99px;overflow:hidden;margin-top:14px;display:flex}
  .pred-bar .a{background:linear-gradient(90deg,#ff5252,var(--red))}
  .pred-bar .b{background:linear-gradient(90deg,#3b82f6,#1e40af)}

  /* ---------- 선수 상세 ---------- */
  .fighter-hero{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:center;background:linear-gradient(180deg,#1a0808,#0e0e0e);border:1px solid var(--line);border-radius:18px;padding:16px}
  .fighter-hero .av{width:88px;height:88px}
  .fighter-hero .avatar{width:88px;height:88px;font-size:24px}
  .fighter-hero h1,.fighter-hero h2{margin:0 0 2px;font-size:20px;font-weight:900}
  .fighter-hero .nick{color:var(--gold-2);font-size:12px;font-weight:700;letter-spacing:.04em}
  .fighter-hero .rec{margin-top:6px;font-size:13px;color:#ddd}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .stat-cell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
  .stat-cell .k{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .stat-cell .v{font-size:14px;font-weight:800;margin-top:3px}
  .recent-list{display:flex;flex-direction:column;gap:8px}
  .recent-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
  .res-tag{width:24px;height:24px;border-radius:6px;font-weight:900;font-size:11px;display:grid;place-items:center}
  .res-tag.W{background:rgba(34,197,94,.18);color:#7ee2a4}
  .res-tag.L{background:rgba(210,10,10,.18);color:#ff7676}
  .res-tag.D{background:#2a2a2a;color:#bbb}
  .recent-item .opp{font-weight:700;font-size:13px}
  .recent-item .way{font-size:11px;color:var(--muted);margin-top:2px}
  .recent-item .when{font-size:11px;color:var(--dim);text-align:right}

  /* ---------- 랭킹 ---------- */
  .rank-row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
  .rank-row:first-child{border-top:0}
  .rank-num{font-weight:900;color:var(--gold-2);font-variant-numeric:tabular-nums;font-size:14px}
  .rank-row .nm{font-weight:700;font-size:13.5px}
  .rank-row .country{font-size:11px;color:var(--muted)}
  .rank-row .rec{font-size:11px;color:var(--dim)}
  .champ-row{background:linear-gradient(90deg,rgba(212,160,23,.12),transparent);border-radius:12px}
  .champ-row .rank-num{color:#fff}
  .crown{color:var(--gold-2)}

  /* ---------- 결과 리스트 ---------- */
  .result-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  .result-card h3,.result-card h4{margin:0 0 4px;font-size:14px;font-weight:800}
  .result-card .when{font-size:11px;color:var(--muted)}
  .result-fight{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
  .result-fight .nm{font-size:12.5px;font-weight:700}
  .result-fight .nm.win{color:#7ee2a4}
  .result-fight .nm.lose{color:var(--dim)}
  .result-fight .vs-mid{font-size:11px;color:var(--dim);text-align:center}
  .result-fight.right{text-align:right}
  .way-tag{font-size:10px;color:#ddd;margin-top:2px}

  /* ---------- 하단 네비 ---------- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(10,10,10,.92);backdrop-filter:saturate(140%) blur(10px);
    border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(5,1fr);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:64px;color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.04em}
  .tabbar a.active{color:#fff}
  .tabbar a.active .ic{color:var(--red-2)}
  .tabbar .ic{font-size:18px;line-height:1}

  /* ---------- 뒤로가기 헤더 ---------- */
  .back-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .back-bar button{width:36px;height:36px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);display:grid;place-items:center}
  .back-bar h3{margin:0;font-size:15px;font-weight:800}

  /* ---------- 푸터 안내 ---------- */
  .disclaimer{margin-top:18px;padding:12px;border:1px dashed var(--line);border-radius:10px;font-size:11px;color:var(--dim);line-height:1.5}
  .page-heading{margin:4px 2px 16px;font-size:25px;line-height:1.2;letter-spacing:-.035em}
  .page-heading small{display:block;margin-top:6px;color:var(--muted);font-size:13px;font-weight:500;letter-spacing:0}
  .state-card{min-height:260px;display:grid;place-items:center;text-align:center;padding:32px 18px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
  .state-card h1,.state-card h2{margin:0 0 8px;font-size:22px}
  .state-card p{max-width:430px;margin:0;color:var(--muted);font-size:14px;line-height:1.65}
  .state-card .btn{max-width:220px;margin:18px auto 0}
  .freshness{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 16px;padding:10px 12px;border-radius:10px;background:var(--bg-2);color:var(--muted);font-size:12px}
  .freshness.stale{border:1px solid rgba(229,72,77,.45);color:#ffb4b7}
  .freshness strong{color:var(--text)}
  .list-summary{margin:-6px 2px 12px;color:var(--muted);font-size:12px}
  .load-more{width:100%;margin-top:12px}
  dialog{width:min(92vw,480px);padding:0;border:1px solid var(--line-2);border-radius:18px;background:var(--card-2);color:var(--text);box-shadow:0 24px 80px rgba(0,0,0,.65)}
  dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(3px)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
  .modal-head h2{margin:0;font-size:18px}
  .modal-body{padding:18px}
  .modal-body p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.6}
  .modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .modal-actions .btn{min-width:150px}
  .setting-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .setting-row:first-child{border-top:0}
  .setting-row input{width:20px;height:20px;accent-color:var(--red)}
  body.wide-layout main,body.wide-layout .tabbar,body.wide-layout .topbar{max-width:1120px!important}

  /* ---------- 데스크톱 ---------- */
  @media (min-width:780px){
    body{padding-bottom:24px}
    main{padding:24px;max-width:960px}
    .hero h1{font-size:28px}
    .ev-grid{grid-template-columns:repeat(4,1fr)}
    .stat-grid{grid-template-columns:repeat(6,1fr)}
    .tabbar{position:sticky;top:73px;border-top:0;border-bottom:1px solid var(--line);grid-template-columns:repeat(5,minmax(0,140px));max-width:960px;margin:0 auto}
    .topbar{padding-left:24px;padding-right:24px}
  }

  /* ================================================================
     시안 D · 에디토리얼 오버라이드 — 글로우/그라데이션/이모지 제거, 절제
     ================================================================ */
  /* 브랜드 마크: 글로우 제거, 평면 */
  .brand .mark{background:var(--red)!important;box-shadow:none!important;border-radius:8px}
  .topbar{border-bottom:1px solid var(--line);background:rgba(11,11,12,.8)}

  /* 히어로: 강한 레드/골드 글로우 → 은은한 톤 + 상단 실선 포인트 */
  .hero{background:var(--card)!important;border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:var(--red);opacity:.9}
  .hero .label{color:var(--dim);letter-spacing:.14em;text-transform:uppercase;font-size:11px;font-weight:700}
  .hero .label .dot{box-shadow:none!important;animation:none!important;width:6px;height:6px}
  .hero h1{letter-spacing:-.03em}

  /* 카운트다운: 골드 → 화이트(단색), tabular */
  .countdown .num,.cd-cell .num{color:var(--text)!important;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.03em}
  .cd-cell{background:transparent!important;border:0!important}

  /* 버튼: 글로우 제거, 평면 */
  .btn.primary{box-shadow:none!important;background:var(--red);color:#fff}
  .btn{border-radius:12px}

  /* 배너/파이터 히어로/챔프행: 레드·골드 그라데이션 → 평면 카드 */
  .ev-banner,.fighter-hero{background:var(--card)!important;border:1px solid var(--line)}
  .ev-banner{position:relative;overflow:hidden}
  .ev-banner::before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:var(--red)}
  .champ-row{background:transparent!important}

  /* 아바타(구형 .avatar): 그라데이션 → 평면 톤 */
  .avatar.red{background:var(--bg-2)!important;border-color:var(--line-2)!important;color:var(--text)}
  .avatar.blue{background:var(--bg-2)!important;border-color:var(--line-2)!important;color:var(--text)}

  /* 예측 바: 그라데이션 → 단색 */
  .pred-bar{border-radius:20px;overflow:hidden}
  .pred-bar .a{background:var(--red)!important}
  .pred-bar .b{background:var(--blue)!important}

  /* 섹션 타이틀: 얇은 액센트 바 + 자간 */
  .section-title{font-weight:800;letter-spacing:-.02em}
  .section-title .bar{width:3px;background:var(--red);border-radius:2px}

  /* 카드/박스: 헤어라인 톤 */
  .card,.box,.result-card,.fight-card,.event-item,.stat-cell{background:var(--card);border-color:var(--line)}

  /* pill: 채움 → 아웃라인 절제 */
  .pill{border-radius:20px;font-weight:700}
  .pill.gold{color:var(--gold-2);background:transparent;border:1px solid var(--line-2)}
  .pill.ghost{background:transparent;border:1px solid var(--line-2);color:var(--muted)}

  /* 탭바: 이모지 제거 + 미니멀 + 액센트 점 */
  .tabbar{background:rgba(11,11,12,.86);backdrop-filter:blur(16px)}
  .ic{display:none!important}  /* 이모지 아이콘 전역 숨김(탭바·섹션헤더) */
  .tabbar a{color:var(--dim);font-weight:600;font-size:12px;gap:0;padding:4px 0}
  .tabbar a.active{color:var(--text)}
  .tabbar a.active::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--red);margin:5px auto 0}

  /* 반응 버튼: 절제 (테두리 톤) */
  .disclaimer{border-style:solid;border-color:var(--line)}

  /* 콘텐츠를 가운데 좁은 칼럼으로 (데스크톱에서 너무 퍼지지 않게) */
  body{margin-left:auto;margin-right:auto}
  .topbar,.tabbar{max-width:1080px;margin-left:auto!important;margin-right:auto!important}
  @media (min-width:780px){ main{max-width:1080px}.view{max-width:760px;margin:0 auto}.view.home-view{max-width:1080px} }

  /* ---- 홈 커버 (잡지 표지형: 톱 매치업 얼굴 크게) ---- */
  .cover{text-align:center;padding:20px 0 10px}
  .cover-kick{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .cover-faces{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin:18px 0 12px}
  .cover .cf{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
  .cover .cf-img{width:150px;height:150px;max-width:40vw;max-height:40vw;margin:0 auto}
  .cover .cf-img>div{width:100%!important;height:100%!important}
  .cover .cf-img svg{width:100%!important;height:100%!important}
  .cover .cf-nm{font-weight:800;font-size:18px;letter-spacing:-.025em;line-height:1.15}
  .cover .cf-rec{font-size:12px;color:var(--muted)}
  .cover .cf-vs{font-weight:800;color:var(--dim);font-size:15px}
  .cover-title{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:8px 4px 4px}
  .cover-meta{color:var(--muted);font-size:13px;line-height:1.5;padding:0 8px}
  .cover-cd{margin:18px auto 14px;max-width:340px}

  /* ---- 주요 경기 카드 (중요도 크기) ---- */
  .bigcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mcard{grid-column:span 1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:.14s;overflow:hidden}
  .mcard.big{grid-column:span 2}
  .mcard:active{transform:scale(.99)}
  .mcard-top{display:flex;justify-content:space-between;align-items:center}
  .mcard-code{font-weight:800;font-size:13px}
  .mcard-d{font-size:11px;color:var(--red);font-weight:700;letter-spacing:.02em}
  .mcard-faces{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;min-width:0}
  .mcard .mf{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
  .mcard .mf-nm{font-size:12px;font-weight:700;text-align:center;line-height:1.2;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
  .mcard.big .mf-nm{font-size:14px}
  .mcard .mf-vs{font-size:11px;color:var(--dim);font-weight:700}
  .mcard-sub{font-size:11px;color:var(--dim);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---- 2026 리디자인: 사진 중심 스포츠 에디토리얼 ---- */
  .avatar-box{position:relative;overflow:hidden;flex-shrink:0;background:#19191c;border:1px solid var(--line-2)}
  .avatar-box img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;filter:saturate(.88) contrast(1.03)}
  .avatar-box.ufc-full{background:
    radial-gradient(70% 55% at 50% 30%,rgba(229,72,77,.16),transparent 75%),
    linear-gradient(180deg,#202024,#101012)}
  .avatar-box.ufc-full img{object-fit:contain;object-position:center bottom;padding:3px 4px 0;filter:saturate(.94) contrast(1.04)}
  .avatar-box.ufc-headshot img{object-fit:cover;object-position:center 18%;filter:saturate(.94) contrast(1.04)}
  .avatar-fallback{width:100%;height:100%;display:grid;place-items:center;position:relative;
    background:linear-gradient(145deg,#242428 0%,#111114 68%);isolation:isolate}
  .avatar-fallback::before{content:"";position:absolute;inset:auto -18% -45% 30%;height:90%;border-radius:50%;
    background:var(--fighter-accent,#e5484d);opacity:.16;filter:blur(1px);z-index:-1}
  .avatar-fallback::after{content:"";position:absolute;left:10%;top:12%;width:28%;height:2px;background:var(--fighter-accent,#e5484d);opacity:.85}
  .avatar-fallback span{font-weight:900;font-size:clamp(13px,30%,34px);letter-spacing:-.04em;color:#f4f3ef}
  .name-original{display:block;margin-top:3px;color:var(--muted);font-size:10px;font-weight:550;letter-spacing:.01em}
  .photo-credit{display:inline-flex;margin-top:8px;color:var(--dim);font-size:10px;text-decoration:underline;text-underline-offset:3px}

  .cover{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:0 0 20px;overflow:hidden}
  .cover::before{content:"";position:absolute;inset:0 0 auto;height:46%;background:
    linear-gradient(135deg,rgba(229,72,77,.18),transparent 46%),
    repeating-linear-gradient(115deg,transparent 0 24px,rgba(255,255,255,.018) 24px 25px);pointer-events:none}
  .cover-kick{position:relative;padding:16px 18px 0;text-align:left;color:#ff878b;letter-spacing:.12em}
  .cover-faces{position:relative;margin:4px 0 10px;padding:14px 10px 0;align-items:start}
  .cover .cf{gap:7px}
  .cover .cf-img{width:168px;height:196px;max-width:39vw;max-height:48vw}
  .cover .cf-img>div{border-radius:16px 16px 6px 6px!important}
  .cover .cf-img>.ufc-full{border:0!important;background:transparent;overflow:visible}
  .cover .cf-img>.ufc-full img{padding:0;filter:drop-shadow(0 14px 16px rgba(0,0,0,.42)) saturate(.96) contrast(1.04)}
  .cover .cf-nm{font-size:17px;line-height:1.08}
  .cover .cf-en{font-size:10px;color:var(--muted);line-height:1.2;min-height:12px}
  .cover .cf-vs{margin-top:78px;width:34px;height:34px;border:1px solid var(--line-2);border-radius:50%;display:grid;place-items:center;background:#0d0d0f;color:#fff}
  .cover-title{font-size:24px;line-height:1.15;margin:14px 18px 5px}
  .cover-meta{padding:0 18px}
  .cover-cd{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;max-width:none;margin:18px 18px 14px}
  .cover .cta{padding:0 18px}.cover .btn.primary{max-width:none}

  .mcard{border-radius:18px}
  .mcard.big{padding:16px}
  .mcard .avatar-box{border-radius:12px!important}
  .mcard .mf-nm{font-size:13px}
  .mcard .mf-en{font-size:9px;color:var(--dim);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .fighter-hero{grid-template-columns:104px 1fr;border-radius:20px;padding:18px}
  .fighter-hero .av{width:104px;height:124px}
  .fighter-hero .av>.avatar-box{width:104px!important;height:124px!important;border-radius:14px!important}
  .fighter-hero h1,.fighter-hero h2{font-size:24px;line-height:1.08}
  .fighter-hero .nick{margin-top:5px;color:var(--muted);letter-spacing:0}
  .fight-card .avatar-box,.event-item .avatar-box{border-radius:10px!important}

  /* ---- 홈: 이번 주 경기 브리핑 ---- */
  .week-brief{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:
    radial-gradient(70% 50% at 18% 12%,rgba(229,72,77,.17),transparent 72%),
    linear-gradient(145deg,#141416,#0e0e10 65%)}
  .week-brief::before{content:"";position:absolute;inset:0;pointer-events:none;background:
    repeating-linear-gradient(118deg,transparent 0 38px,rgba(255,255,255,.014) 38px 39px)}
  .week-head{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:17px 18px 12px;border-bottom:1px solid var(--line)}
  .week-eyebrow{font-size:11px;font-weight:850;letter-spacing:.14em;color:#ff8589;text-transform:uppercase}
  .week-time{margin-top:5px;font-size:22px;font-weight:900;letter-spacing:-.035em}
  .week-sub{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.45}
  .week-d{flex-shrink:0;padding:7px 10px;border:1px solid rgba(255,116,121,.35);border-radius:20px;color:#ff8b8f;font-size:11px;font-weight:800}
  .brief-grid{position:relative;display:grid;grid-template-columns:1fr;min-width:0}
  .match-stage{position:relative;min-width:0;padding:14px 12px 16px}

  .match-stage .cf-img{width:132px;height:166px;max-width:36vw;max-height:45vw}
  .match-stage .cf-img>div{width:100%!important;height:100%!important;border-radius:14px 14px 5px 5px!important}
  .match-stage .cf-img>.ufc-full{border:0!important;background:transparent;overflow:visible}
  .match-stage .cf-img>.ufc-full img{padding:0;filter:drop-shadow(0 14px 16px rgba(0,0,0,.48)) saturate(.96) contrast(1.04)}
  .match-stage .cf-vs{margin-top:59px;width:32px;height:32px;border:1px solid var(--line-2);border-radius:50%;display:grid;place-items:center;background:#0b0b0d;color:#fff;font-size:11px}
  .match-stage .cf-nm{font-size:17px;font-weight:850;letter-spacing:-.03em;line-height:1.08}
  .match-stage .cf-en{font-size:9px;color:var(--dim);min-height:11px}
  .match-stage .cf-rec{font-size:11px;color:var(--muted)}
  .brief-intel{position:relative;border-top:1px solid var(--line);padding:16px 18px 18px;background:rgba(8,8,10,.42)}
  .brief-thesis{font-size:16px;line-height:1.52;font-weight:750;letter-spacing:-.015em;margin-bottom:16px}
  .signal-label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:13px;font-size:11px;color:var(--muted)}
  .signal-label b{font-size:12px;color:var(--text)}
  .signal-names{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:12px;font-weight:750}

  .signal-bar .dog{background:#536780}
  .signal-odds{display:flex;justify-content:space-between;margin-top:6px;color:var(--dim);font-size:11px}

  .signal-note a,.brief-sources a{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
  .fan-model{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .community-tone{margin-top:9px;padding:9px 10px;border-left:2px solid var(--line-2);color:var(--muted);font-size:11px;line-height:1.45}
  .mini-signal{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.018)}
  .mini-signal span{display:block;font-size:10px;color:var(--dim)}

  .mini-signal a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
  .watch-panel{position:relative;padding:18px;border-top:1px solid var(--line)}

  @media (min-width:780px){
    .cover{padding-bottom:24px}.cover-faces{padding:18px 80px 0}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>

</main>

<dialog id="appDialog" aria-labelledby="dialogTitle">
  <div class="modal-head"><h2 id="dialogTitle">FightOclock</h2><button id="dialogClose" class="iconbtn" type="button" aria-label="닫기">×</button></div>
  <div id="dialogBody" class="modal-body"></div>
</dialog>

<script>
/* 실데이터는 data/*.json에서만 로드한다. */
const FIGHTERS = {};
let EVENTS = [];
const RANKINGS = {'체급별 랭킹':[]};

/* =========================================================
   라우터 / 뷰
   ========================================================= */
const $app = document.getElementById('app');
const $tabs = document.querySelectorAll('.tabbar a');
const $dialog = document.getElementById('appDialog');
const $dialogBody = document.getElementById('dialogBody');
let appState = 'loading';
let loadErrors = [];
let DATA_META = {generatedAt:null, source:'Wikipedia', upcoming:0, past:0};
let scheduleFilter = 'all';
let rankingFilter = 0;
let fighterQuery = '';
let fighterLimit = 60;

function esc(value){
  return String(value??'').replace(/[&<>"']/g, ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[ch]);
}
function cleanExternalText(value){
  return String(value??'').replace(/[<>]/g,'').trim();
}
function safeExternalUrl(value){
  if(!value) return '';
  try {
    const url = new URL(value, location.origin);
    return /^https?:$/.test(url.protocol) ? url.href : '';
  } catch(_){ return ''; }
}
function eventSortValue(e){
  const raw = e.dateUtc || (e.dateIso ? e.dateIso+'T12:00:00Z' : '');
  const n = raw ? new Date(raw).getTime() : Number.MAX_SAFE_INTEGER;
  return Number.isFinite(n) ? n : Number.MAX_SAFE_INTEGER;
}
function todayKstIso(){
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const value=Object.fromEntries(parts.map(p=>[p.type,p.value]));
  return `${value.year}-${value.month}-${value.day}`;
}

function fmtDate(d){
  if(!d) return '시작 시각 확인 중';
  const dt = new Date(d);
  const ko = dt.toLocaleString('ko-KR', { timeZone:'Asia/Seoul', month:'long', day:'numeric', weekday:'short', hour:'2-digit', minute:'2-digit', hour12:false });
  return ko;
}
function fmtShort(d){
  if(!d) return {m:'미정',day:'-',w:''};
  const dt = new Date(d);
  const m = dt.toLocaleString('ko-KR',{timeZone:'Asia/Seoul', month:'short'});
  const day = dt.toLocaleString('ko-KR',{timeZone:'Asia/Seoul', day:'numeric'});
  const w = dt.toLocaleString('ko-KR',{timeZone:'Asia/Seoul', weekday:'short'});
  return {m, day, w};
}
function fmtEventShort(e){
  if(e.dateUtc) return fmtShort(e.dateUtc);
  if(!e.dateIso) return {m:'미정',day:'-',w:''};
  const [y,m,d] = e.dateIso.split('-').map(Number);
  const dt = new Date(Date.UTC(y,m-1,d,12));
  return {
    m:dt.toLocaleString('ko-KR',{timeZone:'UTC',month:'short'}),
    day:dt.toLocaleString('ko-KR',{timeZone:'UTC',day:'numeric'}),
    w:dt.toLocaleString('ko-KR',{timeZone:'UTC',weekday:'short'})
  };
}
function eventTimeLabel(e){
  return e.timeConfirmed ? `${fmtDate(e.dateUtc)} KST` : `현지 날짜 ${e.dateLabel||e.dateIso||'미정'} · 시작 시각 확인 중`;
}
function getFighter(id){ return FIGHTERS[id] || REAL_FIGHTERS[id] || {name: (id||'TBA').replace(/-/g,' ').replace(/\b\w/g, c=>c.toUpperCase()), record:'-', rank:'-', recent:[], style:'데이터 수집 중'} }
function getEvent(id){ return EVENTS.find(e=>e.id===id) }
function nextEvent(){
  return upcomingEvents()[0];
}
function pastEvents(){
  return EVENTS.filter(e=>e.status==='past').sort((a,b)=>eventSortValue(b)-eventSortValue(a));
}
function upcomingEvents(){
  return EVENTS.filter(e=>e.status==='upcoming').sort((a,b)=>eventSortValue(a)-eventSortValue(b));
}
function countdownParts(targetIso){
  if(!targetIso) return null;
  const now = new Date();
  const t = new Date(targetIso) - now;
  const sec = Math.max(0, Math.floor(t/1000));
  const d = Math.floor(sec/86400);
  const h = Math.floor((sec%86400)/3600);
  const m = Math.floor((sec%3600)/60);
  const s = sec%60;
  return {d,h,m,s};
}
function freshnessInfo(){
  if(!DATA_META.generatedAt) return {text:'업데이트 시각을 확인할 수 없습니다.',stale:true,days:null};
  const age = Date.now()-new Date(DATA_META.generatedAt).getTime();
  const days = Math.max(0,Math.floor(age/86400000));
  return {
    days,
    stale:age>48*60*60*1000,
    text:days===0?'오늘 업데이트':`${days}일 전 업데이트`
  };
}
function freshnessBanner(){
  const f=freshnessInfo();
  return `<div class="freshness ${f.stale?'stale':''}" role="${f.stale?'alert':'status'}">
    <span><strong>데이터 상태</strong> · ${esc(f.text)}${f.stale?' — 일정이 변경됐을 수 있습니다.':''}</span>
    <span>${DATA_META.upcoming}개 예정</span>
  </div>`;
}

/* ---------- 컴포넌트 ---------- */
/* 사진이 없는 선수의 폴백 컬러: 타격가=빨강, 그래플러=골드, 판정형=블루 */
function fighterStyleColor(f){
  const ko=f.ko||0, sub=f.sub||0, dec=f.dec||0, t=ko+sub+dec;
  if(t<=0) return {c1:'#3a3a3a', c2:'#555', glyph:''};
  if(ko>=sub && ko>=dec)  return {c1:'#d20a0a', c2:'#ff4d4d', glyph:'👊'}; // 타격가
  if(sub>=ko && sub>=dec) return {c1:'#b8860b', c2:'#f5c542', glyph:'🥋'}; // 그래플러
  return {c1:'#3b5566', c2:'#6b93ad', glyph:'⚖️'};                        // 판정형
}
function fighterPictogram(f, size){
  size = size || 48;
  const s = fighterStyleColor(f);
  const source=(f?.en||f?.name||'?').trim().split(/\s+/).filter(Boolean);
  const initials=(source.length>1 ? source[0][0]+source[source.length-1][0] : source[0]?.slice(0,2) || '?').toUpperCase();
  return `<div class="avatar-fallback" style="--fighter-accent:${s.c1}" aria-hidden="true"><span>${esc(initials)}</span></div>`;
}
function avatarBox(f, size){
  size = size || 48;
  const provider = f?.avatarProvider || '';
  const useFull = provider==='UFC' && size>=120;
  const src = f ? safeExternalUrl(useFull ? f.avatar : (f.avatarThumb || f.avatar)) : '';
  const kindClass = useFull ? 'ufc-full' : (provider==='UFC' ? 'ufc-headshot' : '');
  const fallback = fighterPictogram(f||{},size);
  const inner = src
    ? `<img src="${esc(src)}" width="${size}" height="${size}" alt="${esc((f?.name||'선수')+' 사진')}"
         loading="${size>=120?'eager':'lazy'}" decoding="async" referrerpolicy="no-referrer"
         onerror="this.outerHTML=this.getAttribute('data-fb')" data-fb='${fallback.replace(/'/g,"&#39;")}'>`
    : fallback;
  return `<div class="avatar-box ${kindClass}" style="width:${size}px;height:${size}px;border-radius:${size>=80?16:12}px">${inner}</div>`;
}
function fighterAvatar(f, side){
  return avatarBox(f, 44);
}
function fightRow(fight, opts={}){
  const a = getFighter(fight.a), b = getFighter(fight.b);
  const aWin = fight.winner===fight.a;
  const bWin = fight.winner===fight.b;
  return `
  <div class="fight-card">
    <div class="head"><span>${fight.wc}</span>${fight.preview?`<b>${fight.preview}</b>`:''}</div>
    <div class="fight-row">
      <a class="f-side" href="#fighter/${fight.a||''}">
        <div class="av">${fighterAvatar(a,'red')}</div>
        <div class="nm-wrap">
          <div class="nm">${esc(a.name||'TBA')}${a.en&&a.en!==a.name?`<span class="name-original">${esc(a.en)}</span>`:''}</div>
          <div class="sub">${a.record||''} · ${a.rank||''}</div>
        </div>
      </a>
      <div class="vs-tiny">VS</div>
      <a class="f-side right" href="#fighter/${fight.b||''}">
        <div class="av">${fighterAvatar(b,'blue')}</div>
        <div class="nm-wrap">
          <div class="nm">${esc(b.name||'TBA')}${b.en&&b.en!==b.name?`<span class="name-original">${esc(b.en)}</span>`:''}</div>
          <div class="sub">${b.record||''} · ${b.rank||''}</div>
        </div>
      </a>
    </div>
    ${fight.winner ? `
      <div class="result-row win">
        <span class="winbadge">승</span>${getFighter(fight.winner).name}
        ${fight.way?` <span style="color:var(--muted)">· ${fight.way}</span>`:''}
      </div>` : ''
    }
  </div>`;
}

/* ---------- 뷰: 홈 ---------- */
/* 이벤트 중요도 점수 — PPV·타이틀·랭커 기반 (진열 크기·순서용) */
function eventScore(ev){
  let s = 0;
  if(/^UFC\s*\d/i.test(ev.code||'')) s += 4;            // 넘버드 PPV
  const m = ev.mainCard && ev.mainCard[0];
  if(m){
    const a=getFighter(m.a), b=getFighter(m.b);
    if(a.rank==='챔피언'||b.rank==='챔피언') s += 3;      // 타이틀전
    if(/^#|챔피언|잠정/.test(a.rank||'')) s += 1;
    if(/^#|챔피언|잠정/.test(b.rank||'')) s += 1;
    if(/(?:^|\s)[2-9](?:\s|$)|리매치/.test(ev.title||'')) s += 1; // 리매치
  }
  return s;
}
function dLabel(dateUtc){
  if(!dateUtc) return '시각 미정';
  const days = Math.ceil((new Date(dateUtc) - new Date())/86400000);
  if(days<=0) return 'LIVE';
  return 'D-'+days;
}

let homeSort = 'time';  // 'time'(경기 시간순) | 'pop'(인기순)
/* 정렬 전환 시 전체 재렌더(스크롤 튐) 대신 이 섹션만 제자리 갱신 */
function setHomeSort(mode){
  if(mode===homeSort) return;
  homeSort = mode;
  const el = document.getElementById('homeSortSection');
  if(el) el.innerHTML = homeSortSection(); else route();
}
function homeSortSection(){
  const cover = nextEvent();
  if(!cover) return '';
  const rest = upcomingEvents().filter(ev=>ev.id!==cover.id);
  if(homeSort==='pop') rest.sort((x,y)=>eventScore(y)-eventScore(x));
  else rest.sort((x,y)=>new Date(x.dateUtc)-new Date(y.dateUtc));
  const seg=(mode,label)=>{const on=homeSort===mode;
    return `<button onclick="setHomeSort('${mode}')" style="padding:6px 13px;border-radius:20px;font-size:12px;font-weight:700;transition:.14s;
      border:1px solid ${on?'var(--red)':'var(--line-2)'};background:${on?'var(--red)':'transparent'};color:${on?'#fff':'var(--dim)'}">${label}</button>`;};
  return `
  <div style="height:56px"></div>
  <div style="border-top:1px solid rgba(255,255,255,.16);padding-top:24px">
    <div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:800;margin-bottom:8px">다른 대회 · Upcoming Events</div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap">
      <div>
        <div style="font-size:21px;font-weight:800;letter-spacing:-.02em">다가오는 대회</div>
        <div style="font-size:12px;color:var(--muted);margin-top:3px"><b>${cover.code}</b> 말고, 이후에 따로 열리는 대회들이에요</div>
      </div>
      <span style="display:flex;align-items:center;gap:6px;flex-shrink:0">${seg('time','시간순')}<span style="color:var(--dim);font-size:13px">⇄</span>${seg('pop','인기순')}</span>
    </div>
  </div>
  <div style="height:16px"></div>
  <div class="bigcards">
    ${rest.slice(0,6).map((ev,i)=>{
      const m = ev.mainCard?.[0];
      const fa = m?getFighter(m.a):null, fb = m?getFighter(m.b):null;
      const big = i<2;
      if(!m) return '';
      return `
      <a href="#event/${ev.id}" class="mcard ${big?'big':''}">
        <div class="mcard-top"><span class="mcard-code">${ev.code}</span><span class="mcard-d">${dLabel(ev.dateUtc)}</span></div>
        <div class="mcard-faces">
          <div class="mf">${avatarBox(fa,big?76:52)}<div class="mf-nm">${esc(fa.name)}</div>${fa.en!==fa.name?`<div class="mf-en">${esc(fa.en)}</div>`:''}</div>
          <div class="mf-vs">VS</div>
          <div class="mf">${avatarBox(fb,big?76:52)}<div class="mf-nm">${esc(fb.name)}</div>${fb.en!==fb.name?`<div class="mf-en">${esc(fb.en)}</div>`:''}</div>
        </div>
        <div class="mcard-sub">${ev.titleKo||ev.title} · ${ev.city}</div>
      </a>`;
    }).join('')}
  </div>`;
}

function insightFor(e){
  return e ? (INSIGHTS[e.id] || {}) : {};
}

function weekBrief(e, main, a, b){
  const intel = insightFor(e);
  const schedule = intel.schedule || {};
  const market = intel.market || e.prediction || {};
  const fans = intel.fans || {};
  const models = intel.models || {};
  const points = intel.watch_points || newbieGuide(e)?.points?.slice(0,3).map((text,i)=>({title:`관전 포인트 ${i+1}`,text:text.replace(/<[^>]+>/g,'')})) || [];
  const aPct = Number(market.fighter_a_pct ?? market.aPct ?? 50);
  const bPct = Number(market.fighter_b_pct ?? market.bPct ?? (100-aPct));
  const cd = countdownParts(e.dateUtc);
  const sourceLink = (url,label)=>url?`<a href="${esc(safeExternalUrl(url))}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>`:esc(label);
  return `
  <section class="week-brief" aria-labelledby="weekFightTitle">
    <div class="week-head">
      <div>
        <div class="week-eyebrow">이번 주 UFC · ${esc(e.city||'')}</div>
        <div class="week-time">${esc(schedule.label || eventTimeLabel(e))}</div>
        <div class="week-sub">프릴림 ${esc(schedule.prelims||'시각 확인 중')} · 메인카드 ${esc(schedule.main_card||'시각 확인 중')} · ${Number(schedule.bout_count)||((e.mainCard||[]).length+(e.prelims||[]).length)}경기</div>
      </div>
      <div class="week-d">${esc(dLabel(e.dateUtc))}</div>
    </div>
    <div class="brief-grid">
      <div class="match-stage">
        <div class="cover-faces">
          <a class="cf" href="#fighter/${main.a}">
            <div class="cf-img">${avatarBox(a,180)}</div>
            <div class="cf-nm">${esc(a.name)}</div>
            <div class="cf-en">${a.en!==a.name?esc(a.en):'&nbsp;'}</div>
            <div class="cf-rec">${esc(a.rank||'')} · ${esc(a.record)}</div>
          </a>
          <div class="cf-vs">VS</div>
          <a class="cf" href="#fighter/${main.b}">
            <div class="cf-img">${avatarBox(b,180)}</div>
            <div class="cf-nm">${esc(b.name)}</div>
            <div class="cf-en">${b.en!==b.name?esc(b.en):'&nbsp;'}</div>
            <div class="cf-rec">${esc(b.rank||'')} · ${esc(b.record)}</div>
          </a>
        </div>
      </div>
      <aside class="brief-intel" aria-label="경기 예상과 여론">
        <div class="brief-thesis">${esc(intel.thesis || `${a.name}와 ${b.name}의 웰터급 5라운드 메인이벤트`)}</div>
        <div class="signal-label"><b>시장 예상</b><span>${esc(market.as_of||'최신 배당 기준')}</span></div>
        <div class="signal-names"><span>${esc(a.name)} ${aPct}%</span><span>${esc(b.name)} ${bPct}%</span></div>
        <div class="signal-bar" aria-label="${esc(a.name)} ${aPct}%, ${esc(b.name)} ${bPct}%">
          <i class="fav" style="width:${Math.max(0,Math.min(100,aPct))}%"></i><i class="dog" style="width:${Math.max(0,Math.min(100,bPct))}%"></i>
        </div>
        <div class="signal-odds"><span>${esc(market.fighter_a_odds||'')}</span><span>${esc(market.fighter_b_odds||'')}</span></div>
        <div class="signal-note">${esc(market.label||market.note||'배당을 암시확률로 환산한 시장 지표')} · ${sourceLink(market.source,'출처')}</div>
        <div class="fan-model">
          <div class="mini-signal"><span>팬 선택 · ${esc(fans.label||'공개 투표')}</span><b>${Number(fans.fighter_a_pct)||'-'}% ${esc(a.name)}</b><span>${fans.sample?`표본 ${Number(fans.sample)}명 · `:''}${sourceLink(fans.source,'출처')}</span></div>
          <div class="mini-signal"><span>분석 모델</span><b>${models.fighter_a_low&&models.fighter_a_high?`${models.fighter_a_low}~${models.fighter_a_high}%`:'자료 확인 중'}</b><span>${esc(models.label||'시장과 별도 지표')} · ${sourceLink(models.source,'출처')}</span></div>
        </div>
        ${intel.community_tone?`<div class="community-tone">${esc(intel.community_tone)}</div>`:''}
      </aside>
    </div>
    <div class="watch-panel">
      <div class="watch-title">왜 봐야 하나 · 관전 포인트</div>
      <div class="watch-grid">${points.map((p,i)=>`
        <div class="watch-item"><span class="watch-num">0${i+1}</span><div><b>${esc(p.title||'')}</b><p>${esc(p.text||p)}</p></div></div>`).join('')}</div>
    </div>
    <div class="brief-actions">
      <a class="btn primary" href="#event/${e.id}">전체 대진 자세히 보기</a>
      <button class="btn ghost" type="button" onclick="downloadCalendar('${e.id}')">캘린더 저장</button>
    </div>
    <div class="brief-sources">${esc(schedule.note||'')} ${intel.responsible_note?`· ${esc(intel.responsible_note)}`:''}</div>
  </section>`;
}

function homeCardPreview(e){
  const fights=(e.mainCard||[]).slice(0,5);
  if(!fights.length) return '';
  return `
  <section class="card-preview">
    <div class="card-preview-head"><div><h2>이번 주 메인카드</h2><span>메인이벤트부터 한눈에</span></div><a class="pill ghost" href="#event/${e.id}">전체 대진 →</a></div>
    <div class="card-preview-list">${fights.map(f=>{
      const a=getFighter(f.a), b=getFighter(f.b);
      return `<a class="preview-fight" href="#event/${e.id}">
        <span class="preview-fighter">${avatarBox(a,38)}<b>${esc(a.name)}</b></span>
        <span class="preview-vs">VS<strong>${esc(f.wc||'')}</strong></span>
        <span class="preview-fighter right">${avatarBox(b,38)}<b>${esc(b.name)}</b></span>
      </a>`;
    }).join('')}</div>
  </section>`;
}

function viewHome(){
  const e = nextEvent();
  if(!e){
    const recent = pastEvents().slice(0,3);
    return `
      <h1 class="page-heading">다음 UFC 대회를 확인 중입니다<small>새 일정이 발표되거나 데이터가 갱신되면 이곳에 표시됩니다.</small></h1>
      ${freshnessBanner()}
      <div class="state-card"><div><h2>예정된 대회가 없습니다</h2><p>일정 데이터가 오래됐거나 다음 대회 시작 시각이 아직 발표되지 않았을 수 있습니다.</p><a class="btn primary" href="#schedule">일정 화면 확인</a></div></div>
      ${recent.length?`<h2 class="section-title"><span class="bar"></span>최근 결과</h2><div class="event-list">${recent.map(eventListItem).join('')}</div>`:''}`;
  }
  const main = e.mainCard?.[0];
  const a = main ? getFighter(main.a) : null;
  const b = main ? getFighter(main.b) : null;

  return `
  ${main ? weekBrief(e,main,a,b) : freshnessBanner()}
  ${homeCardPreview(e)}

  <div id="homeSortSection">${homeSortSection()}</div>

  <div class="section-title"><span class="bar"></span>지난 결과</div>
  <div class="event-list">
    ${pastEvents().slice(0,3).map(ev=>{
      const d = fmtEventShort(ev);
      const m = ev.mainCard?.[0];
      const winner = m && m.winner ? getFighter(m.winner).name : '결과 미입력';
      return `
      <a href="#event/${ev.id}" class="event-item">
        <div class="date-block"><div class="m">${d.m}</div><div class="d">${d.day}</div><div class="w">${d.w}</div></div>
        <div>
          <div class="title">${ev.code}: ${ev.titleKo||ev.title}</div>
          <div class="meta"><span class="pill green">${winner} 승</span><span>· ${m?.way||''}</span></div>
        </div>
        <div class="chev">›</div>
      </a>`;
    }).join('')}
  </div>

  <div class="disclaimer">

/* ---------- 뷰: 일정 ---------- */
function isTitleEvent(ev){
  return [...(ev.mainCard||[]),...(ev.prelims||[])].some(f=>{
    const a=getFighter(f.a), b=getFighter(f.b);
    return /타이틀/.test(f.wc||'') || a.rank==='챔피언' || b.rank==='챔피언';
  });
}
function hasKoreanFighter(ev){
  return [...(ev.mainCard||[]),...(ev.prelims||[])].some(f=>
    [getFighter(f.a),getFighter(f.b)].some(x=>/대한민국|한국|Korea/i.test(`${x.country||''} ${x.en||''}`))
  );
}
function filteredSchedule(){
  return upcomingEvents().filter(ev=>{
    if(scheduleFilter==='ppv') return /^UFC\s+\d+/i.test(ev.code||'');
    if(scheduleFilter==='fightnight') return /fight night/i.test(ev.code||'');
    if(scheduleFilter==='title') return isTitleEvent(ev);
    if(scheduleFilter==='korean') return hasKoreanFighter(ev);
    return true;
  });
}
function setScheduleFilter(value){
  scheduleFilter=value;
  route({preserveScroll:true});
}

}

/* 피니시 스타일 분석 (승리 방식 분해 기반, 사실) */
function finishBlock(f){
  const ko=f.ko||0, sub=f.sub||0, dec=f.dec||0, tot=ko+sub+dec;
  if(tot<=0) return '';
  const pct=v=>Math.round(v/tot*100);
  const finishRate=Math.round((ko+sub)/tot*100);
  const label = finishRate>=65 ? `피니시형 — 승리의 ${finishRate}%가 KO·서브미션`
             : finishRate<=35 ? `판정형 — 승리의 ${100-finishRate}%가 판정승`
             : `밸런스형 — 피니시 ${finishRate}% / 판정 ${100-finishRate}%`;
  return `
  <div class="section-title"><span class="bar"></span>피니시 스타일</div>
  <div class="box">
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px">
      <span style="color:var(--muted)">KO/TKO <b style="color:var(--red-2)">${ko}</b></span>
      <span style="color:var(--muted)">서브미션 <b style="color:var(--gold-2)">${sub}</b></span>
      <span style="color:var(--muted)">판정 <b style="color:#bbb">${dec}</b></span>
    </div>
    <div style="display:flex;height:12px;border-radius:7px;overflow:hidden;background:var(--bg-2)">
      <div style="width:${pct(ko)}%;background:var(--red)"></div>
      <div style="width:${pct(sub)}%;background:var(--gold)"></div>
      <div style="width:${pct(dec)}%;background:#555"></div>
    </div>
    <p style="margin-top:9px;font-size:12px;color:var(--muted)">${label}</p>
  </div>`;
}

/* 최근 폼 한 줄 요약 (우리가 가진 최근경기 데이터 기반, 사실) */
function recentFormText(recent){
  if(!recent || !recent.length) return '';
  const w=recent.filter(r=>r.res==='W').length;
  const l=recent.filter(r=>r.res==='L').length;
  const isFin=m=>/KO|TKO|Submission|서브|초크|암바/i.test(m||'');
  // 최신부터 연승
  let streak=0; for(const r of recent){ if(r.res==='W') streak++; else break; }
  const finWins=recent.filter(r=>r.res==='W'&&isFin(r.way)).length;
  let s=`최근 ${recent.length}경기 ${w}승 ${l}패`;
  if(streak>=2) s+=` · ${streak}연승`;
  if(finWins>0) s+=` · 피니시 ${finWins}회`;
  return s;
}

  <div class="disclaimer">전적·랭킹은 Wikipedia에서 자동수집한 참고 정보입니다. ${esc(freshnessInfo().text)}</div>

/* 이모지 반응 바 — 텍스트 없이 클릭만. 내 반응은 즉시(localStorage),
   전체 집계는 Firebase 연결 시 표시(window.getReactionCounts 존재 시). */
const REACTIONS = [
  {e:'🔥', k:'기대돼요'},
  {e:'😱', k:'이변 예감'},
  {e:'👊', k:'KO각'},
  {e:'🥱', k:'글쎄요'},
];
function reactionBar(eventId){
  const mine = (function(){ try { return localStorage.getItem('react:'+eventId)||''; } catch(_){ return ''; } })();
  const counts = (typeof window.getReactionCounts === 'function') ? (window.getReactionCounts(eventId)||null) : null;
  return `

  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">
    ${REACTIONS.map(r=>{
      const active = mine===r.e;
      const c = counts ? (counts[r.e]||0) : null;
      return `<button class="react-btn" data-react="${r.e}" data-event="${eventId}"
        style="padding:9px 15px;border-radius:22px;transition:.14s;font-size:13px;
        border:1px solid ${active?'var(--text)':'var(--line-2)'};background:transparent;
        color:${active?'var(--text)':'var(--muted)'};font-weight:${active?'700':'500'}">

  `;

/* 뉴비 가이드 — 우리가 가진 데이터(랭킹·전적·피니시·리매치)로 관전포인트·맥락 자동 생성.
   지어내기 없음(100% 데이터 기반). API 불필요. */
function fStyleLabel(f){
  const ko=f.ko||0, sub=f.sub||0, dec=f.dec||0, t=ko+sub+dec;
  if(t<=0) return null;
  if(ko>=sub && ko>=dec)  return {label:'타격가',  ico:'🥊', desc:'주먹·킥으로 KO를 노리는 스타일'};
  if(sub>=ko && sub>=dec) return {label:'그래플러', ico:'🥋', desc:'조르기·관절기로 서브미션을 노리는 스타일'};
  return {label:'판정형', ico:'⚖️', desc:'끝까지 밀어붙여 점수로 이기는 스타일'};
}
function finishRate(f){
  const t=(f.ko||0)+(f.sub||0)+(f.dec||0);
  return t>0 ? Math.round(((f.ko||0)+(f.sub||0))/t*100) : null;
}
function newbieGuide(e){
  const m = e.mainCard && e.mainCard[0];
  if(!m) return null;
  const a=getFighter(m.a), b=getFighter(m.b);
  const isTitle  = a.rank==='챔피언' || b.rank==='챔피언';
  const isRematch= /(?:^|\s)[2-9](?:\s|$)/.test(e.title||'') || /리매치|rematch/i.test(e.title||'');
  const bothRanked = /^#|챔피언|잠정/.test(a.rank||'') && /^#|챔피언|잠정/.test(b.rank||'');
  const sa=fStyleLabel(a), sb=fStyleLabel(b);

  const points=[];
  if(isTitle)   points.push('<b>벨트가 걸렸어요</b> — 이기면 그 체급 챔피언이 되는 판');
  if(isRematch) points.push('<b>리턴매치예요</b> — 예전에 한 번 붙었던 둘. 이번엔 결과 뒤집힐지가 포인트');
  if(sa && sb && sa.label!==sb.label)
    points.push(`<b>스타일이 정반대</b>예요 — ${a.name}는 ${sa.label}, ${b.name}는 ${sb.label}. 붙는 그림이 확실해요`);
  else if(sa && sb && sa.label===sb.label)
    points.push(`둘 다 <b>${sa.label}</b> — 같은 무기라, 누가 한 수 위인지 갈리는 싸움이에요`);
  [a,b].forEach(f=>{ const fr=finishRate(f); if(fr!==null && fr>=75) points.push(`${f.name}, <b>피니시율 ${fr}%</b> — 눈 깜짝할 새 끝날 수도 있어요`); });
  if(bothRanked && !isTitle) points.push(`${a.rank} vs ${b.rank} — 상위권 자존심 싸움이거든요`);

  // 맥락 문장 (뉴닉 톤: 짧고 친근하게)
  let ctx = `<b>${e.code}</b>, 이번엔 ${e.city||'해외'}에서 열려요. 메인 이벤트는 <b>${a.name}</b> vs <b>${b.name}</b>`;
  if(isTitle && isRematch) ctx+=` — 챔피언 벨트까지 걸린 <b>리턴매치</b>라, 이번 대회 간판이라고 보면 돼요.`;
  else if(isTitle) ctx+=`, <b>챔피언 벨트</b>가 걸린 큰 판이에요.`;
  else if(isRematch) ctx+=` <b>리턴매치</b>예요. 예전에 한 번 붙었던 둘이라, 다들 결과 바뀔지 지켜보는 중이고요.`;
  else ctx+=` 경기예요.`;
  if(sa && sb && sa.label!==sb.label) ctx+= ` 근데 둘은 스타일이 정반대라, 어느 쪽 방식이 통할지가 진짜 관전 포인트예요.`;

  return {points, ctx};
}

/* ---------- 뷰: 이벤트 상세 ---------- */
/* 볼만 지수(기대지수) — eventScore 기반 1~5 */
function hypeBlock(e){
  const s=eventScore(e);
  const lvl = s>=7?5:s>=5?4:s>=3?3:s>=1?2:1;
  const words={5:'필견',4:'추천',3:'볼만',2:'무난',1:'조용'};
  let segs=''; for(let i=1;i<=5;i++) segs+=`<i style="width:26px;height:3px;border-radius:2px;background:${i<=lvl?'var(--red)':'var(--line-2)'}"></i>`;
  return `<div style="display:flex;align-items:center;gap:11px;margin:16px 2px 4px">
    <span style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700">기대지수</span>
    <span style="display:inline-flex;gap:4px">${segs}</span>
    <b style="font-size:13px">${lvl}.0</b><span style="font-size:12px;color:var(--muted)">· ${words[lvl]}</span></div>`;
}

/* 누가 이길까? — 팬 예측 투표(localStorage, 무계정). 전체 집계는 Firebase 연결 시 */
function pollBlock(id, e){
  const m=e.mainCard&&e.mainCard[0]; if(!m) return '';
  const a=getFighter(m.a), b=getFighter(m.b);
  let mine=''; try{ mine=localStorage.getItem('pick:'+id)||''; }catch(_){}
  let counts=null; try{ if(typeof window.getPickCounts==='function') counts=window.getPickCounts(id); }catch(_){}
  const ca=counts?(counts.a||0):0, cb=counts?(counts.b||0):0, tot=ca+cb;
  const btn=(side,f)=>`<button class="pick-btn" data-pick="${side}" data-ev="${id}"
    style="flex:1;padding:14px;border-radius:12px;font-weight:700;font-size:14px;transition:.14s;
    border:1px solid ${mine===side?'var(--text)':'var(--line-2)'};background:${mine===side?'var(--text)':'transparent'};color:${mine===side?'var(--bg)':'var(--text)'}">${f.name}</button>`;
  const bar = tot>0 ? `
    <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin:12px 0 6px">
      <span>${a.name} ${Math.round(ca/tot*100)}%</span><span>${b.name} ${Math.round(cb/tot*100)}%</span></div>
    <div style="height:8px;border-radius:20px;overflow:hidden;background:var(--line-2);display:flex">
      <div style="width:${Math.round(ca/tot*100)}%;background:var(--red)"></div><div style="width:${Math.round(cb/tot*100)}%;background:var(--blue)"></div></div>
    <div style="font-size:11px;color:var(--dim);margin-top:6px">팬 ${tot.toLocaleString()}명 예측${mine?` · 내 예측: ${mine==='a'?a.name:b.name}`:''}</div>` : '';
  return `
  <div class="section-title"><span class="bar"></span>누가 이길까?</div>
  <div style="display:flex;gap:10px">${btn('a',a)}${btn('b',b)}</div>
  ${bar || `<div style="font-size:11px;color:var(--dim);margin:8px 0 2px 2px">${mine?`내 예측: <b style="color:var(--muted)">${mine==='a'?a.name:b.name}</b> · `:''}팬 전체 집계는 준비 중입니다</div>`}`;
}

/* Tale of the Tape — 메인이벤트 좌우 비교 */
function toteBlock(e){
  const m=e.mainCard&&e.mainCard[0]; if(!m) return '';
  const a=getFighter(m.a), b=getFighter(m.b);
  const cm=v=>{const x=parseInt(v);return isNaN(x)?null:x};
  const row=(lbl,va,vb,aw,bw)=>`
    <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14px;font-weight:700">
      <div style="text-align:right;color:${aw?'var(--text)':'var(--muted)'}">${va||'-'}</div>
      <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:0 14px;white-space:nowrap">${lbl}</div>
      <div style="text-align:left;color:${bw?'var(--text)':'var(--muted)'}">${vb||'-'}</div></div>`;
  const ha=cm(a.height),hb=cm(b.height),ra=cm(a.reach),rb=cm(b.reach);
  const dots=f=>{const r=(f.recent||[]).slice(0,5); if(!r.length) return '<span style="color:var(--dim)">-</span>';
    return '<span style="display:inline-flex;gap:4px">'+r.map(x=>`<i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${x.res==='W'?'var(--green)':(x.res==='L'?'var(--red)':'#555')}"></i>`).join('')+'</span>';};
  return `
  <div class="section-title"><span class="bar"></span>메인 이벤트 비교</div>
  <div class="box">
    <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;margin-bottom:2px">
      <div style="text-align:right"><div style="font-weight:800;font-size:16px;line-height:1.15">${a.name}</div><div style="font-size:11px;color:var(--dim)">${a.rank||''}</div></div>
      <div style="color:var(--dim);font-weight:700;font-size:12px;padding-bottom:3px">VS</div>
      <div><div style="font-weight:800;font-size:16px;line-height:1.15">${b.name}</div><div style="font-size:11px;color:var(--dim)">${b.rank||''}</div></div>
    </div>
    ${row('전적', a.record, b.record)}
    ${row('신장', a.height, b.height, ha&&hb&&ha>hb, ha&&hb&&hb>ha)}
    ${row('리치', a.reach, b.reach, ra&&rb&&ra>rb, ra&&rb&&rb>ra)}
    ${row('나이', a.age?a.age+'세':'', b.age?b.age+'세':'')}
    <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:11px 0;border-top:1px solid var(--line)">
      <div style="text-align:right">${dots(a)}</div>
      <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:0 14px">최근5</div>
      <div style="text-align:left">${dots(b)}</div></div>
  </div>`;
}

/* ---------- 라우터 ---------- */
function updateDocumentMeta(base,arg){
  const labels={home:'홈',schedule:'일정',results:'결과',rankings:'랭킹',fighters:'선수'};
  let title=labels[base]||'홈';
  if(base==='event'){
    const e=getEvent(arg); title=e?`${e.code}: ${e.titleKo||e.title}`:'대회';
  } else if(base==='fighter'){
    const f=FIGHTERS[arg]; title=f?f.name:'선수';
  }
  document.title=base==='home'?'FightOclock · UFC 일정 한국어 가이드':`${title} · FightOclock`;
}
function route(options={}){
  const hash = location.hash.replace(/^#/,'') || 'home';
  const [base, arg] = hash.split('/');
  let html = '';
  $tabs.forEach(a=>{
    const active=a.dataset.tab===base;
    a.classList.toggle('active',active);
    if(active) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
  if(appState==='loading'){
    $app.innerHTML=`<div class="state-card"><div><h1>최신 데이터를 불러오는 중입니다</h1><p>일정, 선수, 랭킹 정보를 확인하고 있습니다.</p></div></div>`;
    return;
  }
  if(appState==='error' && !EVENTS.length){
    $app.setAttribute('aria-busy','false');
    $app.innerHTML=`<div class="state-card"><div><h1>데이터를 불러오지 못했습니다</h1><p>샘플 대진을 대신 보여주지 않습니다. 네트워크나 자동수집 상태를 확인한 뒤 다시 시도해주세요.</p><button class="btn primary" type="button" onclick="retryData()">다시 불러오기</button></div></div>`;
    return;
  }
  switch(base){
    case 'home': html = viewHome(); break;
    case 'schedule': html = viewSchedule(); break;
    case 'results': html = viewResults(); break;
    case 'rankings': html = viewRankings(); break;
    case 'fighters': html = viewFighters(); break;
    case 'fighter': html = viewFighter(arg); break;
    case 'event': html = viewEvent(arg); break;
    default: html = viewHome();
  }
  $app.setAttribute('aria-busy','false');
  $app.innerHTML = `<div class="view active ${base==='home'?'home-view':''}">${html}</div>`;
  updateDocumentMeta(base,arg);
  if(!options.preserveScroll) window.scrollTo({top:0,behavior:'instant'});

  /* 검색 */
  const $search = document.getElementById('fSearch');
  if($search){
    renderFighterList();
    $search.addEventListener('input', e=>{
      fighterQuery=e.target.value;
      fighterLimit=60;
      renderFighterList();
    });
  }

  /* 누가 이길까 예측 투표 */
  document.querySelectorAll('.pick-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const ev=btn.dataset.ev, pick=btn.dataset.pick;
      let prev=null, next=pick;
      try{
        prev=localStorage.getItem('pick:'+ev);
        if(prev===pick){ localStorage.removeItem('pick:'+ev); next=null; }
        else localStorage.setItem('pick:'+ev, pick);
      }catch(_){}
      if(typeof window.recordPick==='function'){ try{ window.recordPick(ev,next,prev); }catch(_){} }
      route({preserveScroll:true});
    });
  });

  /* 이모지 반응 */
  document.querySelectorAll('.react-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const ev = btn.dataset.event, emoji = btn.dataset.react;
      let prev = null, next=emoji;
      try {
        prev = localStorage.getItem('react:'+ev);
        if(prev===emoji){ localStorage.removeItem('react:'+ev); next=null; }
        else { localStorage.setItem('react:'+ev, emoji); }
      } catch(_){}
      if(typeof window.recordReaction==='function'){
        try { window.recordReaction(ev, next, prev); } catch(_){}
      }
      route({preserveScroll:true});
    });
  });
}

function icsEscape(value){return String(value||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n')}
function calendarEndDate(dateIso){
  const d=new Date(`${dateIso}T12:00:00Z`); d.setUTCDate(d.getUTCDate()+1);
  return d.toISOString().slice(0,10).replace(/-/g,'');
}
function downloadCalendar(id){
  const e=getEvent(id); if(!e) return;
  const start=e.timeConfirmed
    ?`DTSTART:${new Date(e.dateUtc).toISOString().replace(/[-:]/g,'').replace('.000','')}`
    :`DTSTART;VALUE=DATE:${(e.dateIso||'').replace(/-/g,'')}`;
  const end=e.timeConfirmed
    ?`DTEND:${new Date(new Date(e.dateUtc).getTime()+3*60*60*1000).toISOString().replace(/[-:]/g,'').replace('.000','')}`
    :`DTEND;VALUE=DATE:${calendarEndDate(e.dateIso)}`;
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FightOclock//KO','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    `UID:${e.id}@fightoclock.kr`,start,end,`SUMMARY:${icsEscape(`${e.code}: ${e.titleKo||e.title}`)}`,
    `LOCATION:${icsEscape(`${e.venue}, ${e.city}`)}`,`DESCRIPTION:${icsEscape(e.timeConfirmed?'한국시간 확정 일정':'시작 시각 미정 · 현지 날짜 기준')}`,
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const url=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download=`fightoclock-${e.id}.ics`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ---------- 실데이터 로더 (data/*.json) ---------- */
let REAL_FIGHTERS = {};
let OPINIONS = {};
let INSIGHTS = {};

function slugify(s){
  return (s||'').toString().toLowerCase().trim()
    .replace(/[^a-z0-9가-힣]+/g,'-')
    .replace(/^-+|-+$/g,'') || 'unknown';
}

function eventCodeFromName(name){
  const m = (name||'').match(/^(UFC[^:]*?)(?::|$)/i);
  return m ? m[1].trim() : 'UFC';
}
function eventTitleFromName(name){
  const m = (name||'').match(/^UFC[^:]*?:\s*(.+)$/i);
  return m ? m[1].trim() : (name||'');
}

/* 신장/리치 정규화: 위키가 미터로 준 "1.80cm" → "180cm" 보정 */
function normHeight(h){
  if(!h) return h;
  const m = /^([\d.]+)\s*cm$/.exec(h);
  if(m){ let n=parseFloat(m[1]); if(n>0 && n<10) n=n*100; return Math.round(n)+'cm'; }
  return h;
}
/* 실 선수 JSON → 내부 FIGHTERS shape */
function transformFighter(f){
  const recent = (f.recent||[]).map(function(r){
    return {
      res: r.result==='win' ? 'W' : (r.result==='loss' ? 'L' : 'D'),
      opp: cleanExternalText(r.opp_ko || r.opp || ''),
      way: cleanExternalText(r.method || ''),
      when: cleanExternalText(r.date || '')
    };
  });
  return {
    id: slugify(f.id||f.name), name: cleanExternalText(f.name_ko || f.name), en: cleanExternalText(f.name), nick: cleanExternalText(f.nick || ''),
    country: cleanExternalText(f.country_ko || f.country || ''),
    age: cleanExternalText(f.age || ''), height: cleanExternalText(normHeight(f.height||'')), reach: cleanExternalText(normHeight(f.reach||'')), stance: cleanExternalText(f.stance || ''),
    record: cleanExternalText(f.record || '-'), weight: cleanExternalText(f.division || '-'), rank: cleanExternalText(f.rank || '랭킹 외'),
    ko: f.win_ko||0, sub: f.win_sub||0, dec: f.win_dec||0,
    avatar: safeExternalUrl(f.avatar || f.avatar_url || ''),
    avatarThumb: safeExternalUrl(f.avatar_thumb_url || f.avatar || f.avatar_url || ''),
    avatarSource: safeExternalUrl(f.avatar_source || ''),
    avatarProvider: cleanExternalText(f.avatar_provider || (f.avatar_url?.includes('ufc.com/images/')?'UFC':'Wikimedia')),
    style: '', recent: recent, next: f.next || null
  };
}

/* 실 이벤트 JSON → 내부 fight/event shape */
function transformFight(m){
  const a = slugify(m.fighter_a);
  const b = slugify(m.fighter_b);
  const winner = m.winner==='a' ? a : (m.winner==='b' ? b : null);
  let way = cleanExternalText(m.method || '');
  if(m.round) way += (way?' · ':'') + 'R' + m.round + (m.time ? ' ' + m.time : '');
  return { wc: cleanExternalText(m.weight_ko || m.weight || ''), a: a, b: b, winner: winner, way: cleanExternalText(way) };
}
function transformJsonEvent(je,status){
  const titleSource = je.name_ko || je.name;
  const startUtc = je.start_time_utc || je.date_utc || null;
  return {
    id: slugify(je.name),
    code: cleanExternalText(eventCodeFromName(titleSource)),
    title: cleanExternalText(eventTitleFromName(je.name||titleSource)),
    titleKo: cleanExternalText(eventTitleFromName(titleSource)),
    dateUtc: startUtc,
    dateIso: je.date_iso || '',
    dateLabel: cleanExternalText(je.date_local_human || je.date_kst_human || je.date_iso || ''),
    timeConfirmed: Boolean(startUtc),
    status,
    venue: cleanExternalText(je.venue_ko || je.venue || 'TBA'),
    city: cleanExternalText(je.location_ko || je.location || ''),
    where: cleanExternalText(je.broadcast || '미정'),
    rounds: 5,
    headline: '',
    summary: cleanExternalText(je.summary_ko || ''),
    keyPoints: [],
    prediction: je.prediction || null,
    wikiUrl: safeExternalUrl(je.wiki_url||''),
    mainCard: (je.main_card||[]).map(transformFight),
    prelims: (je.prelims||[]).map(transformFight)
  };
}

/* 실 랭킹 JSON → 내부 RANKINGS shape */
function transformDivision(d){
  return {
    wc: cleanExternalText(d.wc),
    champ: d.champion ? slugify(d.champion.name) : null,
    list: (d.ranked||[]).map(function(r){ return slugify(r.name); }),
    desc: ''
  };
}

async function loadJSON(path){
  const res = await fetch(path, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + path);
  return res.json();
}

async function loadRealData(){
  loadErrors=[];
  const [fightersResult,rankingsResult,eventsResult,opinionsResult,insightsResult]=await Promise.allSettled([
    loadJSON('./data/fighters.json'),
    loadJSON('./data/rankings.json'),
    loadJSON('./data/events.json'),
    loadJSON('./data/opinions.json'),
    loadJSON('./data/insights.json')
  ]);

  if(fightersResult.status==='fulfilled'){
    const data=fightersResult.value;
    if(data.fighters && data.fighters.length){
      Object.keys(FIGHTERS).forEach(function(k){ delete FIGHTERS[k]; });
      data.fighters.forEach(function(f){ const item=transformFighter(f); FIGHTERS[item.id]=item; });
      console.log('[fightoclock] fighters:', data.fighters.length);
    }
  } else {
    loadErrors.push('선수');
    console.warn('[fightoclock] fighters load failed:', fightersResult.reason?.message);
  }

  if(rankingsResult.status==='fulfilled'){
    const data=rankingsResult.value;
    if(data.divisions && data.divisions.length){
      RANKINGS['체급별 랭킹'] = data.divisions.map(transformDivision);
      console.log('[fightoclock] rankings:', data.divisions.length, 'divisions');
    }
  } else {
    loadErrors.push('랭킹');
    console.warn('[fightoclock] rankings load failed:', rankingsResult.reason?.message);
  }

  if(eventsResult.status==='fulfilled'){
    const data=eventsResult.value;
    const up = data.events || [];
    const past = data.past_events || [];
    if(up.length || past.length){
      EVENTS.length = 0;
      const today=todayKstIso();
      up.forEach(je=>EVENTS.push(transformJsonEvent(je,je.date_iso&&je.date_iso<today?'expired':'upcoming')));
      past.forEach(je=>EVENTS.push(transformJsonEvent(je,'past')));
      DATA_META={generatedAt:data.generated_at||null,source:data.source||'Wikipedia',upcoming:EVENTS.filter(e=>e.status==='upcoming').length,past:past.length};
      console.log('[fightoclock] events:', up.length, 'upcoming /', past.length, 'past @', data.generated_at);
    }
  } else {
    loadErrors.push('일정');
    console.warn('[fightoclock] events load failed:', eventsResult.reason?.message);
  }

  if(opinionsResult.status==='fulfilled'){
    const data=opinionsResult.value;
    if(data.events){
      OPINIONS = data.events;
      console.log('[fightoclock] opinions:', Object.keys(OPINIONS).length, 'events');
    }
  }
  if(insightsResult.status==='fulfilled'){
    INSIGHTS = insightsResult.value.events || {};
    console.log('[fightoclock] insights:', Object.keys(INSIGHTS).length, 'events');
  } else {
    console.warn('[fightoclock] insights load failed:', insightsResult.reason?.message);
  }
  appState=EVENTS.length?'ready':'error';
}

<!-- ===== Firebase 전체 집계 (이모지 반응 · 예측 투표) =====
     아래 FIREBASE_CONFIG 에 Firebase 콘솔의 웹앱 설정을 붙여넣으면 전체 집계가 켜집니다.
     (Firebase 웹 apiKey 는 공개용이라 코드에 넣어도 안전합니다. 값이 없으면 로컬 표시만.) -->
<script>
  window.FIREBASE_CONFIG = null;
  /* 예시:
  window.FIREBASE_CONFIG = {
    apiKey: "AIza....", authDomain: "fightoclock.firebaseapp.com",
    projectId: "fightoclock", storageBucket: "fightoclock.appspot.com",
    messagingSenderId: "000000000000", appId: "1:000...:web:...."
  };
  */
</script>
<script type="module">
  const cfg = window.FIREBASE_CONFIG;
  if (cfg && cfg.projectId) {
    try {
      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      const { getFirestore, doc, onSnapshot, setDoc, increment } =
        await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
      const db = getFirestore(initializeApp(cfg));
      const cache = { react:{}, pick:{} };
      const watching = {};
      function watch(kind, ev){
        const key = kind+':'+ev;
        if (watching[key] || !ev) return; watching[key] = true;
        onSnapshot(doc(db, kind==='react'?'reactions':'picks', ev), s=>{
          cache[kind][ev] = s.data() || {};
          if (typeof window.route === 'function') window.route();
        });
      }
      window.recordReaction = function(ev, next, prev){
        const d = {};
        if (prev && prev!==next) d[prev] = increment(-1);
        if (next && next!==prev) d[next] = increment(1);
        if (Object.keys(d).length) setDoc(doc(db,'reactions',ev), d, {merge:true});
      };
      window.getReactionCounts = function(ev){ watch('react',ev); return cache.react[ev] || null; };
      window.recordPick = function(ev, next, prev){
        const d = {};
        if (prev && prev!==next) d[prev] = increment(-1);
        if (next && next!==prev) d[next] = increment(1);
        if (Object.keys(d).length) setDoc(doc(db,'picks',ev), d, {merge:true});
      };
      window.getPickCounts = function(ev){ watch('pick',ev); return cache.pick[ev] || null; };
      console.log('[fightoclock] Firebase 전체 집계 ON');
    } catch(e){ console.warn('[fightoclock] Firebase init 실패:', e.message); }
  }
</script>
