name: 데이터 자동수집

# 언제 실행할지 정의
on:
  schedule:
    # 매일 KST 오전 6시 (= UTC 21:00 전날)
    - cron: '0 21 * * *'
  workflow_dispatch:  # GitHub 화면에서 수동 실행 버튼

concurrency:
  group: fightoclock-data-refresh
  cancel-in-progress: false

# 이 워크플로우가 가질 권한
permissions:
  contents: write  # data/events.json 자동 커밋용

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 받아오기
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 데이터 수집 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scrape.py

      - name: 데이터와 사이트 검증
        run: python -m unittest discover -s tests -v

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/rankings.json data/champions.json data/fighters.json data/insights.json data/avatars/generated
          if [ -f data/opinions.json ]; then
            git add data/opinions.json
          fi
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 생략"
          else
            git commit -m "data: 자동수집 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git push
          fi
